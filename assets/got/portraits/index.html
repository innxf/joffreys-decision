<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铁王座 · 角色像素头像图册</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#111c20;color:#e8ddc6;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 4vw;background:#19292e;border-bottom:1px solid #56605b}h1{margin:0;font-size:26px}p{color:#bac5c4;margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}input,select,button{font:inherit;background:#23383e;color:#f2e8d2;border:1px solid #78817b;border-radius:5px;padding:8px 12px}input{min-width:240px}button{cursor:pointer}a{color:#e6bf72}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:24px 4vw}article{border:1px solid #3e5357;background:#1b2b30;border-radius:8px;overflow:hidden}article button{display:block;padding:0;border:0;width:100%;border-radius:0;background:#18282b}article img{display:block;width:100%;aspect-ratio:1;object-fit:contain}article .meta{padding:12px}h2{font-size:17px;margin:0}small{color:#aabdbd}.tag{font-size:13px;color:#d8c597}.tag.original{color:#b2d0b8}dialog{width:min(1000px,92vw);max-height:90vh;background:#16262b;color:#eee1c8;border:1px solid #b19b6b;border-radius:8px}dialog::backdrop{background:#000b}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare.single{grid-template-columns:1fr}figure{margin:0}figure img{width:100%;max-height:60vh;object-fit:contain;background:#102025}figcaption{color:#bac5c4}#close{float:right}#details{white-space:pre-line}.empty{padding:24px}footer{padding:18px 4vw;color:#9bb1b5}@media(max-width:600px){.compare{grid-template-columns:1fr}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}article .meta{padding:8px}h2{font-size:14px}}
</style>
<header><h1>铁王座 · 角色像素头像</h1><p>点击头像查看大图与参考剧照。原创头像单独标注，保留原人物编号。</p><nav><input id="search" aria-label="搜索角色" placeholder="姓名、英文名或编号"><select id="kind" aria-label="制作方式"><option value="">全部头像</option><option value="tv-redraw">剧照参考改绘</option><option value="book-original">原著设定原创</option></select><span id="count" role="status"></span></nav></header>
<main id="grid"></main><footer>V1 素材图册 · 不读取或修改游戏存档 · 暂无表情差分</footer>
<dialog id="viewer"><button id="close">关闭</button><h2 id="title"></h2><p id="label"></p><div class="compare" id="compare"><figure><img id="portrait" alt=""><figcaption>像素头像</figcaption></figure><figure id="refFigure"><img id="reference" alt=""><figcaption>制作时采用的剧照参考</figcaption></figure></div><p id="details"></p><a id="source" target="_blank" rel="noopener">查看参考来源</a> · <a id="download" download>下载原尺寸 PNG</a></dialog>
<script>
let data=[];const $=id=>document.getElementById(id);
function show(r){$('title').textContent=r.id+' '+r.name;$('label').textContent=r.label;$('portrait').src=r.file;$('portrait').alt=r.name+'像素头像';$('refFigure').hidden=!r.reference;$('compare').classList.toggle('single',!r.reference);if(r.reference){$('reference').src=r.reference;$('reference').alt=r.name+'剧照参考'}$('details').textContent=r.note+'\n尺寸：'+r.width+' × '+r.height+'；每人一张。';$('source').href=r.source_page;$('download').href=r.file;$('viewer').showModal()}
function render(){const q=$('search').value.trim().toLowerCase(),kind=$('kind').value;const list=data.filter(r=>(!kind||r.kind===kind)&&(!q||(r.id+' '+r.name+' '+r.english).toLowerCase().includes(q)));$('grid').replaceChildren();for(const r of list){const card=document.createElement('article'),b=document.createElement('button'),im=document.createElement('img'),meta=document.createElement('div'),title=document.createElement('h2'),id=document.createElement('small'),tag=document.createElement('div');b.setAttribute('aria-label','查看'+r.name);im.src=r.file;im.alt=r.name;im.loading='lazy';b.append(im);b.onclick=()=>show(r);meta.className='meta';title.textContent=r.name;id.textContent=r.id;tag.className='tag'+(r.kind==='book-original'?' original':'');tag.textContent=r.label;meta.append(id,title,tag);card.append(b,meta);$('grid').append(card)}$('count').textContent=list.length+' / '+data.length+' 位';}
$('search').oninput=render;$('kind').onchange=render;$('close').onclick=()=>$('viewer').close();$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close()};
fetch('manifest.json').then(r=>{if(!r.ok)throw Error('清单读取失败');return r.json()}).then(m=>{data=m.portraits;render()}).catch(e=>{$('count').textContent=e.message+'，请通过本机 8087 服务打开图册。'});
</script></html>
